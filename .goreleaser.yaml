# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# ============================================================================
# distributed-metrics GoReleaser config
#
# Packages already-built Rust binaries (from cargo zigbuild on Linux + native
# cargo build on macOS — see apps/customer/distributed-metrics/.gitlab-ci.yml)
# into customer-friendly distribution formats and publishes to:
#
#   - GitHub Releases (BitpingApp/distributed-metrics)  archives + checksums
#   - Homebrew tap   (BitpingApp/homebrew-tap)          `brew install bitpingapp/tap/distributed-metrics`
#   - AUR            (distributed-metrics-bin)          `yay -S distributed-metrics-bin`
#   - deb/rpm/apk    (attached to the release)          `curl ... | sudo dpkg -i`
#   - Docker         (ghcr.io/bitpingapp/distributed-metrics)
# ============================================================================

version: 2

project_name: distributed-metrics

builds:
  - id: distributed-metrics
    builder: prebuilt
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    binary: distributed-metrics
    prebuilt:
      path: "dist/raw/{{ .Os }}-{{ .Arch }}/distributed-metrics"

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.xz]
    files:
      - LICENSE.md
      - README.md
      - Metrics.example.yaml

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}_SHA256SUMS"
  algorithm: sha256

nfpms:
  - id: packages
    package_name: distributed-metrics
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, apk]
    homepage: "https://bitping.com"
    maintainer: "Bitping <support@bitping.com>"
    description: "Monitoring tool backed by Bitping's distributed network, exposed as a Prometheus metrics endpoint."
    license: "MIT"
    bindir: /usr/local/bin
    contents:
      - src: LICENSE.md
        dst: /usr/share/doc/distributed-metrics/LICENSE.md
      - src: README.md
        dst: /usr/share/doc/distributed-metrics/README.md
      - src: Metrics.example.yaml
        dst: /etc/distributed-metrics/Metrics.example.yaml
        type: config|noreplace

brews:
  - name: distributed-metrics
    repository:
      owner: BitpingApp
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://bitping.com"
    description: "Monitoring tool backed by Bitping's distributed network"
    license: "MIT"
    install: |
      bin.install "distributed-metrics"

aurs:
  - name: distributed-metrics-bin
    homepage: "https://bitping.com"
    description: "Monitoring tool backed by Bitping's distributed network"
    maintainers:
      - "Bitping <support@bitping.com>"
    license: "MIT"
    private_key: /tmp/bitping-releaser.pem
    git_url: "ssh://aur@aur.archlinux.org/distributed-metrics-bin.git"
    package: |-
      install -Dm755 ./distributed-metrics "${pkgdir}/usr/bin/distributed-metrics"
      install -Dm644 ./LICENSE.md "${pkgdir}/usr/share/licenses/distributed-metrics-bin/LICENSE.md"

dockers:
  - image_templates:
      - "ghcr.io/bitpingapp/distributed-metrics:{{ .Version }}-amd64"
      - "ghcr.io/bitpingapp/distributed-metrics:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=distributed-metrics"
      - "--label=org.opencontainers.image.source=https://github.com/BitpingApp/distributed-metrics"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - image_templates:
      - "ghcr.io/bitpingapp/distributed-metrics:{{ .Version }}-arm64"
      - "ghcr.io/bitpingapp/distributed-metrics:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=distributed-metrics"
      - "--label=org.opencontainers.image.source=https://github.com/BitpingApp/distributed-metrics"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/bitpingapp/distributed-metrics:{{ .Version }}"
    image_templates:
      - "ghcr.io/bitpingapp/distributed-metrics:{{ .Version }}-amd64"
      - "ghcr.io/bitpingapp/distributed-metrics:{{ .Version }}-arm64"
  - name_template: "ghcr.io/bitpingapp/distributed-metrics:latest"
    image_templates:
      - "ghcr.io/bitpingapp/distributed-metrics:latest-amd64"
      - "ghcr.io/bitpingapp/distributed-metrics:latest-arm64"

release:
  github:
    owner: BitpingApp
    name: distributed-metrics
  name_template: "distributed-metrics {{ .Tag }}"
  prerelease: auto
  draft: false

# Conventional-commit-driven changelog. Commits scoped to this app (e.g.
# `feat(distributed-metrics): ...`) are included; everything else from the
# monorepo is excluded. Sections are grouped by conventional-commit type.
changelog:
  use: git
  sort: asc
  filters:
    include:
      - '^[a-z]+\(distributed-metrics\)(!)?:'
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "Merge "
  groups:
    - title: "Features"
      regexp: '^feat\(distributed-metrics\)'
      order: 0
    - title: "Bug fixes"
      regexp: '^fix\(distributed-metrics\)'
      order: 1
    - title: "Performance"
      regexp: '^perf\(distributed-metrics\)'
      order: 2
    - title: "Refactors"
      regexp: '^refactor\(distributed-metrics\)'
      order: 3
    - title: "Other"
      order: 999
