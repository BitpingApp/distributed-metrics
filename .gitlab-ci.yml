# ============================================================================
# distributed-metrics customer release pipeline (thin wrapper)
#
# Build + publish logic lives in apps/customer/.shared-ci.yml. This file just
# supplies distributed-metrics-specific variables.
#
# Triggered manually via GitLab UI → "Run pipeline" with
# `DISTRIBUTED_METRICS_RELEASE_VERSION=X.Y.Z` set. The root `.gitlab-ci.yml`'s
# include is gated on that variable. The pipeline:
#   1. distributed-metrics:prepare bumps Cargo.toml to the target version,
#      pushes the bump back to monorepo master, and subtree-pushes to GitHub.
#   2. distributed-metrics:release runs GoReleaser (builder: rust → cargo
#      zigbuild) and builds + packages + publishes all 4 targets in one job.
# ============================================================================

include:
  - local: "apps/customer/.shared-ci.yml"

distributed-metrics:prepare:
  extends: .customer_prepare
  variables:
    CUSTOMER_APP: distributed-metrics
    CUSTOMER_CARGO_TOML: apps/customer/distributed-metrics/Cargo.toml
    RELEASE_VERSION: $DISTRIBUTED_METRICS_RELEASE_VERSION

distributed-metrics:release:
  extends: .customer_release
  needs:
    - job: distributed-metrics:prepare
  variables:
    CUSTOMER_APP: distributed-metrics
    # Map the operator-set env var into the generic name the template reads.
    RELEASE_VERSION: $DISTRIBUTED_METRICS_RELEASE_VERSION
